version: '3.8'

services:
  fedora-minimal:
    image: registry.fedoraproject.org/fedora-minimal:42
    container_name: fedora42-clang
    stdin_open: true
    tty: true
    volumes:
      - ./config/fedora-clang-initialconfig.sh:/usr/local/bin/container-initialconfig.sh:Z
      - ./os-disk/fedora42-clang:/workspace:Z
      - ./data-disk:/home/hostuser:Z
    entrypoint: ["container-initialconfig.sh"]
    healthcheck:
      # wait for 60 minutes
      test: ["CMD", "test", "-f", "/var/run/container-initialconfig-ok"]
      interval: 30s
      timeout: 5s
      retries: 120
      start_period: 60s
    command: 
      - "/bin/bash"

x-podman:
  in_pod: false

# check its installation with
# podman healthcheck run fedora42-clang

# run subsequently with
# podman exec -it fedora42-clang /bin/bash
