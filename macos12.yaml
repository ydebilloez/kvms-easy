version: '3.8'

services:
  macos:
    image: docker.io/dockurr/macos
    container_name: macos12
    environment:
      VERSION: "12"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./os-disk/macos12:/storage
    stop_grace_period: 2m
