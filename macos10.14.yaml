version: '3.8'

services:
  macos:
    image: docker.io/dockurr/macos
    container_name: macos10.14
    privileged: true
    environment:
      VERSION: "10.14"
      RAM_SIZE: "8G"
      CPU_CORES: "1"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp

x-podman:
  in_pod: false