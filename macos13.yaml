version: '3.8'

services:
  macos:
    image: docker.io/dockurr/macos
    container_name: macos13
    environment:
      VERSION: "13"
      RAM_SIZE: "9G"
      CPU_CORES: "6"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./os-disk/macos13:/storage:Z
    stop_grace_period: 2m

x-podman:
  in_pod: false