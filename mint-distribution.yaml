version: '3.8'

services:
  mint-gui:
    image: docker.io/qemux/qemu
    container_name: mint-distribution
    environment:
      BOOT: "mint"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
    volumes:
      - ./os-disk/mint-distribution:/storage:Z
    stop_grace_period: 2m

x-podman:
  in_pod: false